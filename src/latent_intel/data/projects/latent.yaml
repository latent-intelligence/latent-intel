# latent — the project that ships with the engine.
#
# It declares branding and nothing else. There is deliberately no default store: a tool
# that arrives already pointed at something has decided for you, and this one should not.
#
# It is also the worked example. Everything a client project may set is shown here,
# commented, in the order the loader reads it. Copy this file, not the documentation.

schema_version: 1
name: latent
title: Latent
description: >
  Context over heterogeneous sources — wikis, files, MCP servers — with provenance.

# Where names resolve. A project may carry its own registry so `from: design-wiki`
# means the same thing on every machine the project is cloned to.
#
# registry: ./knowledge-stores.yaml

# Location variables, substituted into `registry:`, `root:` and each source `target:`.
# An environment variable of the same name WINS, so a deployment overrides without
# editing this file. Locations only — credentials never appear here.
#
# vars:
#   MIRROR: s3://example-bucket/li

# Where this deployment's products go. Defaults to this file's directory; a relative
# path resolves against it, and a URI such as s3://… is kept as written.
#
# root: ./products

# Sources. Two ways to name one, and the difference matters:
#
#   from:    a registry id, re-resolved per machine. Portable.
#   target:  a literal path or URI. Relative paths resolve against THIS FILE'S
#            directory, so a cloned project repo works from anywhere.
#
# `remote: true` prefers a registry entry's mirror over any local copy — which is a
# different thing from a `target:` that is already remote, like an s3:// URI.
#
# A wiki is an MCP source: its own server, `latent-wiki serve`, gives it its tools (search,
# evidence, views), and a latent-wiki deployment names its store, its context and its
# refs. Without the server, a wiki's pages are Markdown, and a `files` source reads them.
# A records store is an MCP source the same way, through `latent-records serve`.
#
# sources:
#   - {id: wiki,  kind: mcp,   target: "latent-wiki serve --deployment ~/client/deployments/wiki"}
#   - {id: hives, kind: mcp,   target: "latent-records serve --deployment ~/client/deployments/hives"}
#   - {id: pages, kind: files, target: "${MIRROR}/wikis/design/pages"}
#   - {id: named, kind: files, from: design-wiki, remote: true}
#   - {id: docs,  kind: files, target: "${MIRROR}/context/raw"}
#   - {id: local, kind: files, target: ./corpus}
#   - {id: tools, kind: mcp,   target: "npx -y @example/mcp"}

branding:
  name: LATENT
  tagline: context, with provenance
  # logo: ./logo.txt          # or an inline block scalar; without one, Latent's logo
  # prompt: "latent › "       # defaults to the lowercased name
  # theme:                    # semantic tokens only — unknown names are reported
  #   accent: "#a7c080"

# agent:
#   persona: ./persona.md     # appended to, or substituted into, the system prompt
#   persona_mode: append      # append | replace
#   runtime: claude-cli       # a default the user may still override
#   runtimes:
#     claude-cli: {model: sonnet}

# commands: ./commands        # *.md, one per command — live
# skills:   ./skills          # name.md or name/SKILL.md, loaded when a question needs one
# agents:   ./agents          # agents/<name>.md, Claude Code's format; run by claude-agent-sdk

# defaults:
#   approval: ask
#   web: off                 # off | search | browse
